spring.application.name=neurowiki-backend

# Database Configuration (H2 embedded in PostgreSQL mode by default)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:neurowikidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# Multipart File Upload Config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:neurowiki_super_secret_jwt_key_which_is_at_least_256_bits_long_for_hs256_security_token!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Provider Configuration (reads AI_API_KEY with GEMINI_API_KEY fallback)
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.model=${AI_MODEL:gemini-flash-latest}
ai.base.url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
embedding.model=${EMBEDDING_MODEL:gemini-embedding-001}

# Server Port
server.port=8080

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.neurowiki=INFO
